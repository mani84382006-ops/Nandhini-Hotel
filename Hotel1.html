<!DOCTYPE html>
<html>
<head>
<title>Nandhini Biryani Order</title>

<style>

body{
font-family: Arial;
margin:0;
padding:0;

background-image: url("Hotel.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;

color:white;
text-align:center;
}

.menu{
background:rgba(0,0,0,0.7);
padding:20px;
margin:40px auto;
border-radius:10px;
width:300px;
}

input,select{
width:90%;
padding:8px;
margin:5px;
border-radius:5px;
border:none;
}

button{
background:red;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:darkred;
}

</style>

</head>

<body>

<h1>Nandhini Biryani Online Order</h1>

<div class="menu">

<select>
<option>Chicken Biryani</option>
<option>Chilli Chicken</option>
<option>Mutton Biryani</option>
<option>Egg Biryani</option>
</select>

<input type="text" placeholder="Enter Name">
<input type="text" placeholder="Enter Phone Number">
<input type="text" placeholder="Enter Address">
<input type="number" placeholder="Quantity">

<br><br>

<label>
<input type="checkbox"> Confirm Order
</label>

<br><br>

<button>Order Now</button>

</div>

</body>
</html>
