<!DOCTYPE html>

<html>
<head>
<title>Sample projects</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
color:white;
background-image:url("Biryani.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
}

header{
background:black;
padding:20px;
text-align:center;
font-size:32px;
letter-spacing:2px;
text-shadow:2px 2px 10px orange;
}

.hero{
height:200px;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
text-align:center;
}

.slider{
width:90%;
margin:auto;
overflow:hidden;
border-radius:10px;
}

.slider img{
width:100%;
height:300px;
object-fit:cover;
}

/* ZOMATO STYLE CARDS */

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:30px;
}

.card{
background:white;
width:240px;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
transition:0.3s;
color:black;
position:relative;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.rating{
position:absolute;
top:10px;
right:10px;
background:#267e3e;
color:white;
padding:4px 8px;
border-radius:5px;
font-size:14px;
}

.card-body{
padding:15px;
text-align:center;
}

.price{
color:#e23744;
font-weight:bold;
font-size:18px;
}

.order-btn{
background:#e23744;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.order-btn:hover{
background:#c71c2c;
}

.order-box{
background:#222;
padding:20px;
margin:30px auto;
width:300px;
border-radius:10px;
text-align:center;
}

input,select{
width:90%;
padding:10px;
margin:5px;
border-radius:5px;
border:none;
}

button{
background:red;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

footer{
text-align:center;
padding:15px;
background:black;
}

@media(max-width:768px){

.hero{
font-size:26px;
height:150px;
}

.menu{
flex-direction:column;
align-items:center;
}

.card{
width:85%;
}

.order-box{
width:90%;
}

}

</style>

</head>

<body>

<header>
Sample projects
</header>

<div class="hero">
Best Biryani in Town
</div>

<div class="slider">
<img id="slide" src="chicken.jpg">
</div>

<div class="menu">

<div class="card">
<span class="rating">4.5 ⭐</span>
<img src="chicken.jpg">
<div class="card-body">
<h3>Chicken Biryani</h3>
<p class="price">₹200</p>
<button class="order-btn">Order</button>
</div>
</div>

<div class="card">
<span class="rating">4.4 ⭐</span>
<img src="chilli.jpg">
<div class="card-body">
<h3>Chilli Chicken</h3>
<p class="price">₹180</p>
<button class="order-btn">Order</button>
</div>
</div>

<div class="card">
<span class="rating">4.7 ⭐</span>
<img src="mutton.jpg">
<div class="card-body">
<h3>Mutton Biryani</h3>
<p class="price">₹300</p>
<button class="order-btn">Order</button>
</div>
</div>

<div class="card">
<span class="rating">4.3 ⭐</span>
<img src="egg.jpg">
<div class="card-body">
<h3>Egg Biryani</h3>
<p class="price">₹150</p>
<button class="order-btn">Order</button>
</div>
</div>

</div>

<div class="order-box">

<h3>Order Now</h3>

<select id="item">
<option>Chicken Biryani</option>
<option>Chilli Chicken</option>
<option>Mutton Biryani</option>
<option>Egg Biryani</option>
</select>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Address">
<input type="number" id="qty" placeholder="Quantity">

<br><br>

<label>
<input type="checkbox" id="confirm"> Confirm Order
</label>

<br><br>

<button onclick="sendOrder()">Order via WhatsApp</button>

</div>

<footer>
© 2026 Nandhini Biryani
</footer>

<script>

let images=["chicken.jpg","mutton.jpg","chilli.jpg","egg.jpg"];
let i=0;

setInterval(function(){
i++;
if(i>=images.length){i=0;}
document.getElementById("slide").src=images[i];
},2000);

function sendOrder(){

let item=document.getElementById("item").value;
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;
let qty=document.getElementById("qty").value;
let confirm=document.getElementById("confirm").checked;

if(!confirm){
alert("Please confirm your order");
return;
}

let msg="Sample Projects"
+"Item: "+item+"%0A"
+"Name: "+name+"%0A"
+"Phone: "+phone+"%0A"
+"Address: "+address+"%0A"
+"Qty: "+qty;

window.open("https://wa.me/919042908156?text="+msg);

}

</script>

</body>
</html>
