<!DOCTYPE html>
<html>
<head>
<title>Nandhini Biryani Order</title>

<style>

body{
font-family: Arial;
margin:0;
padding:0;

background-image: url("Hotel.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;

color:white;
text-align:center;
}

.menu{
background:rgba(0,0,0,0.7);
padding:20px;
margin:40px auto;
border-radius:10px;
width:300px;
}

input,select{
width:90%;
padding:8px;
margin:5px;
border-radius:5px;
border:none;
}

button{
background:red;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:darkred;
}

</style>

</head>

<body>

<h1>Nandhini Biryani Online Order</h1>

<div class="menu">

<select id="item">
<option>Chicken Biryani</option>
<option>Chilli Chicken</option>
<option>Mutton Biryani</option>
<option>Egg Biryani</option>
</select>

<input type="text" id="name" placeholder="Enter Name">
<input type="text" id="phone" placeholder="Enter Phone Number">
<input type="text" id="address" placeholder="Enter Address">
<input type="number" id="qty" placeholder="Quantity">

<br><br>

<label>
<input type="checkbox" id="confirm"> Confirm Order
</label>

<br><br>

<button onclick="sendOrder()">Order Now</button>

</div>

<script>

function sendOrder(){

let item=document.getElementById("item").value;
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;
let qty=document.getElementById("qty").value;
let confirm=document.getElementById("confirm").checked;

if(!confirm){
alert("Please confirm the order");
return;
}

let msg="Hello Nandhini Biryani%0A"
+"Item: "+item+"%0A"
+"Name: "+name+"%0A"
+"Phone: "+phone+"%0A"
+"Address: "+address+"%0A"
+"Quantity: "+qty;

let url="https://wa.me/918438366136?text="+msg;

window.open(url,"_blank");

}

</script>

</body>
</html>
